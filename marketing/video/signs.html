<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>فحص تسرّب العدّاد: ٣ علامات</title>
<link rel="stylesheet" href="fonts.css">
<style>
* { box-sizing: border-box; margin: 0; }
html, body { width: 1080px; height: 1920px; overflow: hidden; }
#stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #efe4d2; color: #2b2118; font-family: "Readex Pro", sans-serif; }
#grain { position: absolute; inset: 0; opacity: .5; background-image: radial-gradient(rgba(43,33,24,.06) 1px, transparent 1px); background-size: 6px 6px; }
.t { position: absolute; left: 90px; right: 90px; text-align: center; will-change: transform, opacity; }
.accent { color: #d8562a; }

#h1 { top: 560px; font-size: 180px; font-weight: 700; line-height: 1; white-space: nowrap; }
#h2 { top: 820px; font-size: 84px; font-weight: 700; line-height: 1.25; }

.num { position: absolute; top: 330px; left: 0; right: 0; text-align: center; font: 700 520px/1 "Readex Pro", sans-serif; color: #d8562a; will-change: transform, opacity; }
.cap { position: absolute; top: 1000px; left: 90px; right: 90px; text-align: center; font-size: 82px; font-weight: 700; line-height: 1.3; will-change: transform, opacity; }
.hint { position: absolute; top: 1330px; left: 120px; right: 120px; text-align: center; font-size: 44px; color: #7a6a58; will-change: opacity; }

#meter { position: absolute; left: 50%; top: 1400px; width: 640px; margin-left: -320px; background: #1b2b31; border-radius: 30px; padding: 24px; display: flex; gap: 6px; justify-content: center; align-items: center; direction: ltr; opacity: 0; }
.d { font: 600 64px/1.2 "IBM Plex Mono", monospace; width: 1.1em; text-align: center; background: #f4f7f8; color: #111; border-radius: 8px; }
.d.r { background: #c2362b; color: #fff; }
#star { width: 70px; height: 70px; margin-left: 18px; }

#cta { top: 470px; font-size: 118px; font-weight: 700; line-height: 1.15; }
#cta2 { top: 800px; font-size: 52px; color: #7a6a58; }
#qrbox { position: absolute; left: 50%; top: 920px; width: 380px; height: 380px; margin-left: -190px; background: #fff; border-radius: 34px; padding: 30px; box-shadow: 0 20px 60px rgba(43,33,24,.15); }
#qrbox svg { width: 100%; height: 100%; display: block; }
#url { position: absolute; left: 50%; top: 1370px; transform: translateX(-50%); direction: ltr; white-space: nowrap; font: 600 40px "IBM Plex Mono", monospace; color: #fff; background: #2b2118; border-radius: 22px; padding: 20px 30px; }
</style>
</head>
<body>
<div id="stage">
  <div id="grain"></div>
  <div class="t" id="h1"><span class="accent">٣</span> علامات</div>
  <div class="t" id="h2">إن بيتك يسرّب ماء<br>وأنت ما تدري</div>

  <div class="num" id="n3">٣</div>
  <div class="cap" id="c3">الماطور يشتغل لحاله<br>بالليل</div>
  <div class="hint" id="i3">وما أحد يستخدم الماء</div>

  <div class="num" id="n2">٢</div>
  <div class="cap" id="c2">فاتورتك زادت<br>وعادتك ما تغيّرت</div>
  <div class="hint" id="i2">نفس العايلة، نفس الاستخدام</div>

  <div class="num" id="n1">١</div>
  <div class="cap" id="c1">النجمة في العدّاد تلف<br>والحنفيات مسكّرة</div>
  <div id="meter">
    <span class="d">0</span><span class="d">1</span><span class="d">2</span><span class="d">3</span><span class="d">4</span>
    <span style="width:10px"></span><span class="d r">5</span><span class="d r">6</span><span class="d r">7</span>
    <svg id="star" viewBox="0 0 40 40"><polygon fill="#c2362b" points="20,2 24,16 38,20 24,24 20,38 16,24 2,20 16,16"/></svg>
  </div>

  <div class="t" id="cta">وحدة منها<br>عندك؟</div>
  <div class="t" id="cta2">تأكد بنفسك في ساعة، مجاناً</div>
  <div id="qrbox"></div>
  <div id="url">naiiif83.github.io/leak-check</div>
</div>
<script>
window.DURATION = 16;
const $ = (id) => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const easeOut = (x) => 1 - Math.pow(1 - x, 3);
const back = (x) => { const c = 1.7; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
function show(id, t, a, b, { dx = 0, dy = 60, d = 0.5, s0 = 1 } = {}) {
  const i = easeOut(prog(t, a, a + d)), o = prog(t, b, b + 0.35);
  const el = $(id);
  el.style.opacity = t < a ? 0 : Math.min(i, 1 - o);
  el.style.transform = `translate(${(1 - i) * dx - o * dx}px, ${(1 - i) * dy}px) scale(${s0 + (1 - s0) * back(prog(t, a, a + d))})`;
}

window.render = function (t) {
  show('h1', t, 0.1, 2.0, { s0: 0.6, dy: 0 });
  show('h2', t, 0.6, 2.0);

  // كل علامة: الرقم يدخل من اليسار، والجملة تطلع تحته
  [['3', 2.3, 5.4], ['2', 5.7, 8.8], ['1', 9.1, 12.2]].forEach(([k, a, b]) => {
    show('n' + k, t, a, b, { dx: -700, dy: 0, d: 0.45 });
    show('c' + k, t, a + 0.35, b);
    if ($('i' + k)) show('i' + k, t, a + 0.9, b, { dy: 20 });
  });
  const m = easeOut(prog(t, 10.0, 10.5)) * (1 - prog(t, 12.2, 12.55));
  $('meter').style.opacity = m;
  $('meter').style.transform = `translateY(${(1 - m) * 40}px)`;
  $('star').style.transform = `rotate(${Math.max(0, t - 10) * 420}deg)`;

  show('cta', t, 12.6, 99, { s0: 0.8, dy: 0 });
  show('cta2', t, 13.1, 99, { dy: 20 });
  show('qrbox', t, 13.5, 99, { s0: 0.8, dy: 0 });
  const u = easeOut(prog(t, 13.9, 14.4));
  $('url').style.opacity = u;
  $('url').style.transform = `translateX(-50%) translateY(${(1 - u) * 30}px)`;
};
window.render(0);
</script>
</body>
</html>
