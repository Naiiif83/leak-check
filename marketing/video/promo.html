<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>فحص تسرّب العدّاد: فيديو 9:16</title>
<link rel="stylesheet" href="fonts.css">
<style>
* { box-sizing: border-box; margin: 0; }
html, body { width: 1080px; height: 1920px; overflow: hidden; background: #081a20; }
#stage {
  position: relative; width: 1080px; height: 1920px; overflow: hidden;
  background: radial-gradient(120% 60% at 50% 40%, #174452 0%, #0e2a33 55%, #081a20 100%);
  color: #f4f7f8; font-family: "Readex Pro", sans-serif;
}
.abs { position: absolute; left: 80px; right: 80px; text-align: center; will-change: transform, opacity; }
.muted { color: #9fc4d1; }
.red { color: #ff7a6b; }

#kicker { top: 330px; font-size: 56px; }
#h1 { top: 420px; font-size: 170px; font-weight: 700; line-height: 1.1; }
#h2 { top: 610px; font-size: 170px; font-weight: 700; line-height: 1.1; }

#meter {
  left: 50%; right: auto; top: 760px; width: 900px; margin-left: -450px;
  background: #05090b; border-radius: 40px; padding: 38px 30px 30px;
  box-shadow: 0 0 0 6px #1b2b31, 0 40px 90px rgba(0,0,0,.5);
  display: grid; gap: 22px; justify-items: center;
}
.dials { display: flex; gap: 8px; direction: ltr; }
.d { font: 600 84px/1.2 "IBM Plex Mono", monospace; width: 1.15em; height: 1.2em; text-align: center; background: #f4f7f8; color: #111; border-radius: 12px; overflow: hidden; position: relative; }
.d.r { background: #c2362b; color: #fff; }
.d span { position: absolute; left: 0; right: 0; }
.gap { width: 16px; }
.meter-cap { font-size: 38px; color: #9fb1b7; display: flex; gap: 16px; align-items: center; }
#star { width: 52px; height: 52px; }

#cap1 { top: 1180px; font-size: 64px; font-weight: 700; }
#cap2 { top: 1275px; font-size: 64px; font-weight: 700; }

#stat { top: 720px; display: grid; gap: 30px; }
#stat .big { font-size: 190px; font-weight: 700; line-height: 1; }
#stat .unit { font-size: 58px; }
#arrow { font-size: 110px; line-height: 1; }
#sar { direction: ltr; display: inline-block; }

#cta1 { top: 560px; font-size: 104px; font-weight: 700; line-height: 1.2; }
#cta2 { top: 860px; font-size: 52px; }
#qrbox { left: 50%; right: auto; top: 1010px; width: 360px; height: 360px; margin-left: -180px; background: #fff; border-radius: 32px; padding: 28px; }
#qrbox svg { width: 100%; height: 100%; display: block; }
#url { top: 1420px; left: 50%; right: auto; transform: translateX(-50%); direction: ltr; font: 600 40px "IBM Plex Mono", monospace; background: #136f8f; border-radius: 22px; padding: 20px 30px; white-space: nowrap; }

#drop { position: absolute; left: 50%; top: 0; width: 60px; margin-left: -30px; opacity: 0; }
</style>
</head>
<body>
<div id="stage">
  <div class="abs muted" id="kicker">فاتورة الماء</div>
  <div class="abs" id="h1">زادت</div>
  <div class="abs red" id="h2">بدون سبب؟</div>

  <div class="abs" id="meter">
    <div class="dials" id="dials"></div>
    <div class="meter-cap">
      <svg id="star" viewBox="0 0 40 40" aria-hidden="true"><polygon fill="#c2362b" points="20,2 24,16 38,20 24,24 20,38 16,24 2,20 16,16"/></svg>
      <span>النجمة تلف</span>
    </div>
  </div>
  <div class="abs" id="cap1">الحنفيات مسكّرة…</div>
  <div class="abs red" id="cap2">والعدّاد يمشي</div>

  <div class="abs" id="stat">
    <div><div class="big red" id="lph">30</div><div class="unit muted">لتر يضيع بالساعة</div></div>
    <div class="muted" id="arrow">↓</div>
    <div><div class="big"><span id="sar">≈0</span></div><div class="unit muted">ريال زيادة كل شهر</div></div>
  </div>

  <div class="abs" id="cta1">افحص بيتك<br>بنفسك في ساعة</div>
  <div class="abs muted" id="cta2">مجاني · من جوالك · بدون فني</div>
  <div class="abs" id="qrbox"></div>
  <div class="abs" id="url">naiiif83.github.io/leak-check</div>
</div>

<script>
window.DURATION = 15;
const $ = (id) => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const easeOut = (x) => 1 - Math.pow(1 - x, 3);
const back = (x) => { const c = 1.9; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
function style(id, o = 1, y = 0, s = 1, extra = '') {
  const el = $(id);
  el.style.opacity = o;
  el.style.transform = `${extra} translateY(${y}px) scale(${s})`;
}
// ظهور ثم اختفاء: in من a إلى a+d، out من b إلى b+d
function inOut(t, a, b, d = 0.35) { return Math.min(easeOut(prog(t, a, a + d)), 1 - prog(t, b, b + d)); }

// الباركود ينحقن من render.js (file:// ما يسمح بـ fetch)

// عدّاد: 5 سود + 3 حمر، الأرقام تلف مثل العدّاد الحقيقي
const dials = $('dials');
dials.innerHTML = [0,1,2,3,4].map(i => `<div class="d" id="dg${i}"><span></span><span></span></div>`).join('') +
  '<div class="gap"></div>' + [5,6,7].map(i => `<div class="d r" id="dg${i}"><span></span><span></span></div>`).join('');
function setMeter(liters) {
  // القراءة بالتر: 1234567 = 1234.567 م³
  const v = 1234567 + liters;
  for (let i = 0; i < 8; i++) {
    const place = Math.pow(10, 7 - i);
    const cur = Math.floor(v / place) % 10;
    // الرقم الأخير يلف بسلاسة، والباقي ينقلب لما يكمل اللي بعده
    const frac = i === 7 ? (v % 1) : (i === 6 ? Math.max(0, (v % 10) - 9) : 0);
    const [a, b] = $('dg' + i).children;
    a.textContent = cur; b.textContent = (cur + 1) % 10;
    a.style.top = `${-frac * 100}%`; b.style.top = `${(1 - frac) * 100}%`;
  }
}

window.render = function (t) {
  // ١: الخطّاف 0–3.2
  style('kicker', inOut(t, 0.15, 3.0), (1 - easeOut(prog(t, 0.15, 0.6))) * 30);
  const p1 = prog(t, 0.45, 0.85), p2 = prog(t, 1.0, 1.4);
  style('h1', Math.min(p1 * 3, 1 - prog(t, 3.0, 3.3)), 0, p1 ? 0.6 + 0.4 * back(p1) : 0.6);
  style('h2', Math.min(p2 * 3, 1 - prog(t, 3.0, 3.3)), 0, p2 ? 0.6 + 0.4 * back(p2) : 0.6, `rotate(${(1 - p2) * -4}deg)`);

  // ٢: العدّاد 3.2–7.4
  const m = inOut(t, 3.2, 7.2, 0.45);
  style('meter', m, (1 - easeOut(prog(t, 3.2, 3.7))) * 120 - prog(t, 7.2, 7.6) * 80);
  const leak = Math.max(0, t - 3.7) * 26; // لترات تمر
  setMeter(Math.min(leak, 26 * 3.5));
  $('star').style.transform = `rotate(${Math.max(0, t - 3.7) * 540}deg)`;
  style('cap1', inOut(t, 4.1, 7.2), (1 - easeOut(prog(t, 4.1, 4.5))) * 40);
  const c2 = prog(t, 5.2, 5.5);
  style('cap2', Math.min(c2 * 2, 1 - prog(t, 7.2, 7.5)), 0, c2 ? 0.8 + 0.2 * back(c2) : 0.8);

  // ٣: الرقم 7.5–10.6
  const s = inOut(t, 7.5, 10.4, 0.4);
  style('stat', s, (1 - easeOut(prog(t, 7.5, 8.0))) * 80);
  $('arrow').style.opacity = prog(t, 8.2, 8.5);
  $('arrow').style.transform = `translateY(${Math.sin(t * 6) * 8}px)`;
  const n = Math.round(100 * easeOut(prog(t, 8.5, 9.7)));
  $('sar').textContent = '≈' + n;
  $('sar').parentElement.style.opacity = prog(t, 8.4, 8.6);

  // ٤: الدعوة 10.6–15
  const q1 = prog(t, 10.6, 11.0);
  style('cta1', q1, (1 - easeOut(q1)) * 60);
  style('cta2', prog(t, 11.3, 11.7), (1 - easeOut(prog(t, 11.3, 11.7))) * 30);
  const q3 = prog(t, 11.8, 12.2);
  style('qrbox', q3, 0, q3 ? 0.7 + 0.3 * back(q3) : 0.7);
  const pulse = t > 12.6 ? 1 + 0.03 * Math.sin((t - 12.6) * 5) : 1;
  const u = prog(t, 12.2, 12.6);
  $('url').style.opacity = u;
  $('url').style.transform = `translateX(-50%) translateY(${(1 - easeOut(u)) * 30}px) scale(${pulse})`;
};
window.render(0);
</script>
</body>
</html>
