<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>فحص تسرّب العدّاد: فيديو الشرح</title>
<link rel="stylesheet" href="fonts.css">
<style>
* { box-sizing: border-box; margin: 0; }
html, body { width: 1080px; height: 1920px; overflow: hidden; }
#stage {
  position: relative; width: 1080px; height: 1920px; overflow: hidden;
  background: linear-gradient(180deg, #0a1e33 0%, #0c2c4a 60%, #0f3a5e 100%);
  color: #eef6fb; font-family: "Readex Pro", sans-serif;
}
canvas#water { position: absolute; inset: 0; }
.t { position: absolute; left: 80px; right: 80px; text-align: center; will-change: transform, opacity; }
.soft { color: #8fc4e3; }

#title { top: 520px; font-size: 100px; font-weight: 700; line-height: 1.2; }
#sub { top: 800px; font-size: 56px; }

#step { top: 250px; font-size: 58px; font-weight: 700; line-height: 1.3; }
#step b { display: inline-block; font: 600 50px "IBM Plex Mono", monospace; color: #0a1e33; background: #7fd3ff; border-radius: 50%; width: 76px; height: 76px; line-height: 76px; margin-left: 18px; vertical-align: middle; }

#phone {
  position: absolute; left: 50%; top: 470px; width: 560px; height: 1180px; margin-left: -280px;
  background: #05101c; border-radius: 70px; padding: 22px;
  box-shadow: 0 0 0 3px #2c4a66, 0 50px 120px rgba(0,0,0,.5);
}
#screen { position: relative; width: 100%; height: 100%; border-radius: 50px; overflow: hidden; background: #eef3f4; }
.shot { position: absolute; inset: 0; background-size: 100% auto; background-repeat: no-repeat; background-position: top center; }
#notch { position: absolute; top: 40px; left: 50%; width: 150px; height: 36px; margin-left: -75px; background: #05101c; border-radius: 20px; z-index: 2; }
#finger { position: absolute; width: 90px; height: 90px; border-radius: 50%; background: rgba(127,211,255,.45); box-shadow: 0 0 0 10px rgba(127,211,255,.18); opacity: 0; z-index: 3; }

#cta { top: 480px; font-size: 104px; font-weight: 700; line-height: 1.2; }
#cta2 { top: 790px; font-size: 52px; }
#qrbox { position: absolute; left: 50%; top: 930px; width: 380px; height: 380px; margin-left: -190px; background: #fff; border-radius: 36px; padding: 30px; }
#qrbox svg { width: 100%; height: 100%; display: block; }
#url { position: absolute; left: 50%; top: 1380px; transform: translateX(-50%); direction: ltr; white-space: nowrap; font: 600 40px "IBM Plex Mono", monospace; color: #0a1e33; background: #7fd3ff; border-radius: 22px; padding: 20px 30px; }

/* بدون باركود ورابط: الرابط في البايو */
#qrbox { display: none !important; }
#url { top: 990px !important; font: 700 66px/1.2 "Readex Pro", sans-serif !important; direction: rtl !important; padding: 28px 48px !important; display: flex; align-items: center; gap: 22px; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="water" width="1080" height="1920"></canvas>

  <div class="t" id="title">كيف تعرف إن بيتك<br>يسرّب ماء؟</div>
  <div class="t soft" id="sub">في ساعة وحدة، من جوالك</div>

  <div class="t" id="step"><b id="stepNo">١</b><span id="stepText"></span></div>
  <div id="phone">
    <div id="notch"></div>
    <div id="screen">
      <div class="shot" id="s1" style="background-image:url(shots/step1.png)"></div>
      <div class="shot" id="s2" style="background-image:url(shots/step2.png)"></div>
      <div class="shot" id="s3" style="background-image:url(shots/step3.png)"></div>
      <div class="shot" id="s4" style="background-image:url(shots/step4.png)"></div>
      <div id="finger"></div>
    </div>
  </div>

  <div class="t" id="cta">جرّبها مجاناً</div>
  <div class="t soft" id="cta2">مجاني، ومن جوالك</div>
  <div id="qrbox"></div>
  <div id="url">الرابط في البايو <svg width="54" height="54" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4 L12 20 M5 11 L12 4 L19 11" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
</div>
<script>
window.DURATION = 18;
const $ = (id) => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const ease = (x) => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const easeOut = (x) => 1 - Math.pow(1 - x, 3);
function fade(id, t, a, b, d = 0.6, dy = 40) {
  const i = easeOut(prog(t, a, a + d)), o = prog(t, b, b + d * 0.7);
  const el = $(id);
  el.style.opacity = Math.min(i, 1 - o);
  el.style.transform = `translateY(${(1 - i) * dy - o * dy}px)`;
}

// نقطة ماء تنزل وتسوي تموجات
const cv = $('water'), cx = cv.getContext('2d');
function drawWater(t) {
  cx.clearRect(0, 0, 1080, 1920);
  const fall = prog(t, 0.2, 1.1);
  if (t < 1.1) {
    const y = 200 + 900 * fall * fall;
    cx.fillStyle = 'rgba(127,211,255,.95)';
    cx.beginPath();
    cx.moveTo(540, y - 70);
    cx.bezierCurveTo(575, y - 20, 590, y + 5, 590, y + 25);
    cx.arc(540, y + 25, 50, 0, Math.PI);
    cx.bezierCurveTo(490, y + 5, 505, y - 20, 540, y - 70);
    cx.fill();
  }
  for (let k = 0; k < 4; k++) {
    const age = t - 1.1 - k * 0.45;
    if (age < 0 || age > 3.2) continue;
    const r = 40 + age * 260, a = Math.max(0, 0.5 - age / 6.4);
    cx.strokeStyle = `rgba(127,211,255,${a})`;
    cx.lineWidth = 4;
    cx.beginPath(); cx.ellipse(540, 1140, r, r * 0.28, 0, 0, Math.PI * 2); cx.stroke();
  }
}

const STEPS = [
  { at: 3.6, no: '١', text: 'اختر كيف يوصل الماء لبيتك' },
  { at: 6.1, no: '٢', text: 'سكّر الماء واكتب رقم العدّاد' },
  { at: 8.6, no: '٣', text: 'انتظر ساعة واكتب الرقم الثاني' },
  { at: 11.1, no: '٤', text: 'تطلع لك النتيجة وكم تخسر' },
];

window.render = function (t) {
  drawWater(t);
  $('water').style.opacity = 1 - prog(t, 3.0, 3.6) * 0.7;

  // ١: العنوان 0–3.4
  fade('title', t, 1.2, 3.0);
  fade('sub', t, 1.8, 3.0);

  // ٢: الجوال 3.4–13.6
  const ph = easeOut(prog(t, 3.2, 3.9)), phOut = prog(t, 13.4, 14.0);
  $('phone').style.opacity = Math.min(ph, 1 - phOut);
  $('phone').style.transform = `translateY(${(1 - ph) * 260 + phOut * -120}px) scale(${1 - phOut * 0.1})`;
  let cur = 0;
  STEPS.forEach((s, i) => { if (t >= s.at - 0.3) cur = i; });
  const s = STEPS[cur];
  $('stepNo').textContent = s.no; $('stepText').textContent = s.text;
  const si = easeOut(prog(t, s.at - 0.3, s.at + 0.2));
  const next = STEPS[cur + 1];
  const so = next ? prog(t, next.at - 0.55, next.at - 0.3) : prog(t, 13.4, 13.8);
  $('step').style.opacity = t < 3.3 ? 0 : Math.min(si, 1 - so);
  $('step').style.transform = `translateY(${(1 - si) * 30}px)`;

  // الشاشات تنزلق من اليمين
  STEPS.forEach((st, i) => {
    const el = $('s' + (i + 1));
    const inP = i === 0 ? 1 : ease(prog(t, st.at - 0.35, st.at + 0.25));
    el.style.transform = `translateX(${(1 - inP) * -100}%)`;
    el.style.zIndex = i + 1;
  });

  // لمسة الإصبع على الأزرار
  const taps = [
    { at: 5.2, x: 258, y: 364 },   // خزان أرضي
    { at: 7.7, x: 258, y: 914 },   // سجّلت الرقم
    { at: 10.2, x: 258, y: 889 },  // شوف النتيجة
  ];
  let fo = 0, fx = 0, fy = 0, fs = 1;
  taps.forEach(tp => {
    const d = t - tp.at;
    if (d > -0.4 && d < 0.5) { fo = d < 0 ? 1 + d / 0.4 : 1 - d / 0.5; fx = tp.x; fy = tp.y; fs = d < 0 ? 1 : 1 + d; }
  });
  const f = $('finger');
  f.style.opacity = Math.max(0, fo);
  f.style.left = (fx - 45) + 'px'; f.style.top = (fy - 45) + 'px';
  f.style.transform = `scale(${fs})`;

  // ٣: الدعوة 14–18
  fade('cta', t, 14.0, 99, 0.7, 60);
  fade('cta2', t, 14.5, 99);
  const q = easeOut(prog(t, 14.9, 15.5));
  $('qrbox').style.opacity = q; $('qrbox').style.transform = `scale(${0.85 + 0.15 * q})`;
  const u = easeOut(prog(t, 15.4, 15.9));
  $('url').style.opacity = u; $('url').style.transform = `translateX(-50%) translateY(${(1 - u) * 30}px)`;
};
window.render(0);
</script>
</body>
</html>
