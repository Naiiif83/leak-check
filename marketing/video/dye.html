<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>فحص تسرّب العدّاد: تجربة الصبغة</title>
<link rel="stylesheet" href="fonts.css">
<style>
* { box-sizing: border-box; margin: 0; }
html, body { width: 1080px; height: 1920px; overflow: hidden; }
#stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #e7f4f1; color: #10302c; font-family: "Readex Pro", sans-serif; }
.t { position: absolute; left: 80px; right: 80px; text-align: center; will-change: transform, opacity; }
#k1 { top: 300px; font-size: 64px; color: #3a7d73; }
#k2 { top: 390px; font-size: 110px; font-weight: 700; line-height: 1.15; }
#cap { top: 250px; font-size: 64px; font-weight: 700; line-height: 1.3; min-height: 170px; }
#art { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
#stamp { position: absolute; left: 50%; top: 1500px; transform: translateX(-50%) rotate(-6deg); font-size: 96px; font-weight: 700; color: #fff; background: #e0452f; padding: 18px 44px; border-radius: 22px; white-space: nowrap; opacity: 0; }
#clock { position: absolute; left: 50%; top: 1470px; width: 230px; height: 230px; margin-left: -115px; opacity: 0; }
#mins { position: absolute; left: 0; right: 0; top: 1720px; text-align: center; font: 600 52px "IBM Plex Mono", monospace; color: #3a7d73; opacity: 0; }

#cta { top: 420px; font-size: 76px; font-weight: 700; line-height: 1.3; }
#cta2 { top: 700px; font-size: 50px; color: #3a7d73; }
#qrbox { position: absolute; left: 50%; top: 830px; width: 380px; height: 380px; margin-left: -190px; background: #fff; border-radius: 34px; padding: 30px; box-shadow: 0 20px 60px rgba(16,48,44,.12); }
#qrbox svg { width: 100%; height: 100%; display: block; }
#url { position: absolute; left: 50%; top: 1280px; transform: translateX(-50%); direction: ltr; white-space: nowrap; font: 600 40px "IBM Plex Mono", monospace; color: #fff; background: #10302c; border-radius: 22px; padding: 20px 30px; }

/* بدون باركود ورابط: الرابط في البايو */
#qrbox { display: none !important; }
#url { top: 890px !important; font: 700 66px/1.2 "Readex Pro", sans-serif !important; direction: rtl !important; padding: 28px 48px !important; display: flex; align-items: center; gap: 22px; }
</style>
</head>
<body>
<div id="stage">
  <div class="t" id="k1">جرّب هالحركة الليلة</div>
  <div class="t" id="k2">تكشف أشهر تسرّب<br>في البيت</div>

  <div class="t" id="cap"></div>
  <svg id="art" viewBox="0 0 1080 1920" aria-hidden="true">
    <g id="toilet"><g transform="translate(54,150) scale(0.9)">
      <!-- الخزان -->
      <rect x="330" y="560" width="420" height="330" rx="34" fill="#ffffff" stroke="#10302c" stroke-width="8"/>
      <rect x="310" y="530" width="460" height="54" rx="20" fill="#ffffff" stroke="#10302c" stroke-width="8"/>
      <clipPath id="tankClip"><rect x="338" y="590" width="404" height="292" rx="28"/></clipPath>
      <rect id="tankWater" x="338" y="660" width="404" height="230" fill="#9fd8f0" clip-path="url(#tankClip)"/>
      <!-- الكرسي -->
      <path d="M300 930 H780 Q780 1120 640 1180 L620 1330 H460 L440 1180 Q300 1120 300 930 Z" fill="#ffffff" stroke="#10302c" stroke-width="8" stroke-linejoin="round"/>
      <ellipse cx="540" cy="930" rx="240" ry="34" fill="#ffffff" stroke="#10302c" stroke-width="8"/>
      <ellipse id="bowlWater" cx="540" cy="1010" rx="170" ry="40" fill="#9fd8f0"/>
      <rect x="505" y="890" width="70" height="44" fill="#ffffff" stroke="#10302c" stroke-width="8"/>
      <!-- القطّارة -->
      <g id="dropper">
        <rect x="515" y="330" width="50" height="120" rx="18" fill="#2f5bff"/>
        <path d="M522 450 H558 L546 510 H534 Z" fill="#dbe7ff" stroke="#2f5bff" stroke-width="6"/>
      </g>
      <circle id="drip" cx="540" cy="520" r="14" fill="#2f5bff"/>
    </g></g>
  </svg>
  <svg id="clock" viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" fill="#fff" stroke="#10302c" stroke-width="6"/><line id="hand" x1="50" y1="50" x2="50" y2="16" stroke="#e0452f" stroke-width="6" stroke-linecap="round"/><circle cx="50" cy="50" r="5" fill="#10302c"/></svg>
  <div id="mins">00:00</div>
  <div id="stamp">سيفونك يسرّب!</div>

  <div class="t" id="cta">هذا السيفون بس.<br>تبغى تفحص البيت كامل؟</div>
  <div class="t" id="cta2">فحص العدّاد في ساعة، مجاناً</div>
  <div id="qrbox"></div>
  <div id="url">الرابط في البايو <svg width="54" height="54" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4 L12 20 M5 11 L12 4 L19 11" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
</div>
<script>
window.DURATION = 17;
const $ = (id) => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const easeOut = (x) => 1 - Math.pow(1 - x, 3);
const back = (x) => { const c = 1.9; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const mix = (a, b, p) => { const h = s => [1, 3, 5].map(i => parseInt(s.substr(i, 2), 16)); const A = h(a), B = h(b); return `rgb(${A.map((v, i) => Math.round(v + (B[i] - v) * p)).join(',')})`; };
function show(id, t, a, b, dy = 40) {
  const i = easeOut(prog(t, a, a + 0.5)), o = prog(t, b, b + 0.35);
  $(id).style.opacity = t < a ? 0 : Math.min(i, 1 - o);
  $(id).style.transform = `translateY(${(1 - i) * dy}px)`;
}
const CAPS = [
  [2.6, 'حط كم نقطة صبغة طعام<br>في خزان السيفون'],
  [6.0, 'لا تسحب السيفون<br>وانتظر ١٥ دقيقة'],
  [9.2, 'طلع اللون في الكرسي؟'],
];

window.render = function (t) {
  show('k1', t, 0.1, 2.3);
  show('k2', t, 0.5, 2.3);

  // الرسمة
  const a = easeOut(prog(t, 2.2, 2.8)), aOut = prog(t, 12.2, 12.7);
  $('toilet').style.opacity = Math.min(a, 1 - aOut);
  $('toilet').style.transform = `translateY(${(1 - a) * 120 + aOut * 80}px)`;

  // النص فوق
  let cap = null;
  CAPS.forEach(c => { if (t >= c[0] - 0.2) cap = c; });
  const capEl = $('cap');
  if (cap && t < 12.2) {
    capEl.innerHTML = cap[1];
    const i = easeOut(prog(t, cap[0] - 0.2, cap[0] + 0.3));
    const nxt = CAPS[CAPS.indexOf(cap) + 1];
    const o = nxt ? prog(t, nxt[0] - 0.45, nxt[0] - 0.2) : prog(t, 12.0, 12.3);
    capEl.style.opacity = Math.min(i, 1 - o);
    capEl.style.transform = `translateY(${(1 - i) * 30}px)`;
  } else capEl.style.opacity = 0;

  // القطّارة تنزل ثلاث نقط
  const dp = easeOut(prog(t, 2.8, 3.3)) * (1 - prog(t, 5.4, 5.8));
  $('dropper').style.opacity = dp;
  $('dropper').style.transform = `translateY(${(1 - dp) * -120}px)`;
  let dripY = -1;
  [3.6, 4.2, 4.8].forEach(d0 => { const p = prog(t, d0, d0 + 0.35); if (p > 0 && p < 1) dripY = 520 + p * p * 160; });
  $('drip').style.opacity = dripY > 0 ? 1 : 0;
  $('drip').setAttribute('cy', dripY > 0 ? dripY : 520);
  const dye = prog(t, 3.9, 5.6);
  $('tankWater').setAttribute('fill', mix('#9fd8f0', '#2f5bff', dye));

  // الساعة
  const c = easeOut(prog(t, 6.2, 6.6)) * (1 - prog(t, 9.0, 9.3));
  $('clock').style.opacity = c; $('mins').style.opacity = c;
  const mm = Math.round(15 * prog(t, 6.6, 8.8));
  $('mins').textContent = `00:${String(mm).padStart(2, '0')}`;
  $('hand').setAttribute('transform', `rotate(${prog(t, 6.6, 8.8) * 360 * 3} 50 50)`);

  // اللون يوصل للكرسي
  const bowl = prog(t, 9.4, 10.6);
  $('bowlWater').setAttribute('fill', mix('#9fd8f0', '#2f5bff', bowl * 0.85));
  const s = prog(t, 10.7, 11.0), sOut = prog(t, 12.2, 12.5);
  $('stamp').style.opacity = t < 10.7 ? 0 : 1 - sOut;
  $('stamp').style.transform = `translateX(-50%) rotate(-6deg) scale(${t < 10.7 ? 1.6 : 1.6 - 0.6 * easeOut(s)})`;

  show('cta', t, 12.6, 99);
  show('cta2', t, 13.1, 99, 20);
  const q = prog(t, 13.5, 13.9);
  $('qrbox').style.opacity = q; $('qrbox').style.transform = `scale(${q ? 0.7 + 0.3 * back(q) : 0.7})`;
  const u = easeOut(prog(t, 13.9, 14.4));
  $('url').style.opacity = u; $('url').style.transform = `translateX(-50%) translateY(${(1 - u) * 30}px)`;
};
window.render(0);
</script>
</body>
</html>
