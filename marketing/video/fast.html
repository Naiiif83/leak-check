<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>فحص تسرّب العدّاد: فيديو سريع</title>
<link rel="stylesheet" href="fonts.css">
<style>
* { box-sizing: border-box; margin: 0; }
html, body { width: 1080px; height: 1920px; overflow: hidden; }
#stage {
  position: relative; width: 1080px; height: 1920px; overflow: hidden;
  background: #f6f3ec; color: #111820; font-family: "Readex Pro", sans-serif;
}
#flash { position: absolute; inset: 0; background: #e8412f; opacity: 0; }
#wipe { position: absolute; left: 0; right: 0; bottom: 0; height: 0; background: #0f5e7a; }
.t { position: absolute; left: 70px; right: 70px; text-align: center; font-weight: 700; line-height: 1.12; will-change: transform, opacity; }
.hl { background: linear-gradient(transparent 58%, #ffd23f 58%, #ffd23f 92%, transparent 92%); padding: 0 12px; }
.red { color: #e8412f; }

#t1 { top: 330px; font-size: 118px; }
#bill {
  position: absolute; left: 50%; top: 640px; width: 660px; margin-left: -330px;
  background: #fff; border-radius: 28px; padding: 44px 48px 40px;
  box-shadow: 0 30px 80px rgba(17,24,32,.18); text-align: center;
}
#bill .lbl { font-size: 40px; color: #6b7480; }
#bill .amt { font: 700 170px/1.05 "Readex Pro", sans-serif; color: #e8412f; direction: ltr; margin-top: 10px; }
#bill .cur { font-size: 52px; color: #111820; }
#bill .line { height: 10px; border-radius: 5px; background: #eef0f2; margin-top: 22px; }
#bill .line.s { width: 60%; margin-inline: auto; }
#t2 { top: 1250px; font-size: 96px; }

#t3 { top: 420px; font-size: 92px; }
.chip {
  position: absolute; left: 50%; width: 760px; margin-left: -380px; height: 170px;
  display: flex; align-items: center; justify-content: center; gap: 30px;
  background: #111820; color: #f6f3ec; border-radius: 30px; font-size: 92px; font-weight: 700;
}
.chip i { font-style: normal; font: 700 56px "IBM Plex Mono", monospace; color: #ffd23f; }
#c1 { top: 760px; } #c2 { top: 970px; } #c3 { top: 1180px; }

#t4 { top: 520px; font-size: 104px; }
#t5 { top: 760px; font-size: 170px; color: #0f5e7a; white-space: nowrap; }
#t6 { top: 1060px; font-size: 92px; }
#t7 { top: 1220px; font-size: 92px; }

#cta { top: 360px; font-size: 118px; color: #fff; }
#cta2 { top: 680px; font-size: 54px; color: #bfe3ef; font-weight: 400; }
#qrbox { position: absolute; left: 50%; top: 820px; width: 380px; height: 380px; margin-left: -190px; background: #fff; border-radius: 34px; padding: 30px; }
#qrbox svg { width: 100%; height: 100%; display: block; }
#url { position: absolute; left: 50%; top: 1270px; transform: translateX(-50%); direction: ltr; white-space: nowrap;
  font: 600 42px "IBM Plex Mono", monospace; color: #0f5e7a; background: #ffd23f; border-radius: 22px; padding: 20px 30px; }
</style>
</head>
<body>
<div id="stage">
  <div id="flash"></div>
  <div id="wipe"></div>

  <div class="t" id="t1">جتك فاتورة الماء</div>
  <div id="bill">
    <div class="lbl">المبلغ المستحق</div>
    <div class="amt"><span id="amt">0</span></div>
    <div class="cur">ريال</div>
    <div class="line"></div><div class="line s"></div>
  </div>
  <div class="t" id="t2">وأنت ما <span class="hl">غيّرت شي</span>!</div>

  <div class="t" id="t3">السبب غالباً تسرّب<br><span class="red">ما تشوفه</span></div>
  <div class="chip" id="c1"><i>01</i>سيفون</div>
  <div class="chip" id="c2"><i>02</i>عوّامة</div>
  <div class="chip" id="c3"><i>03</i>خزان مشقوق</div>

  <div class="t" id="t4">تتأكد بنفسك؟</div>
  <div class="t" id="t5">ساعة وحدة</div>
  <div class="t" id="t6">قراءتين للعدّاد</div>
  <div class="t" id="t7"><span class="hl">بدون فني</span></div>

  <div class="t" id="cta">افحص بيتك<br>الحين</div>
  <div class="t" id="cta2">مجاني · من جوالك</div>
  <div id="qrbox"></div>
  <div id="url">naiiif83.github.io/leak-check</div>
</div>
<script>
window.DURATION = 15;
const $ = (id) => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const easeOut = (x) => 1 - Math.pow(1 - x, 3);
const back = (x) => { const c = 2.2; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
// ضربة: يكبر من 1.35 وينزل على مكانه مع الإيقاع
function slam(id, t, a, b, extra = '') {
  const p = prog(t, a, a + 0.18), out = prog(t, b, b + 0.15);
  const el = $(id);
  el.style.opacity = t < a ? 0 : 1 - out;
  el.style.transform = `${extra} scale(${t < a ? 1.35 : 1.35 - 0.35 * easeOut(p)}) translateY(${-out * 40}px)`;
}
function pop(id, t, a, b, extra = '') {
  const p = prog(t, a, a + 0.28), out = prog(t, b, b + 0.15);
  const el = $(id);
  el.style.opacity = t < a ? 0 : 1 - out;
  el.style.transform = `${extra} scale(${t < a ? 0.5 : 0.5 + 0.5 * back(p)})`;
}

window.render = function (t) {
  // وميض أحمر على الضربات المهمة
  const flash = (at) => Math.max(0, 1 - Math.abs(t - at) / 0.12) * 0.35;
  $('flash').style.opacity = Math.max(flash(2.0), flash(3.5));

  // ١: الفاتورة 0–3.5
  slam('t1', t, 0.0, 3.3);
  const b = prog(t, 0.5, 0.8), bo = prog(t, 3.3, 3.5);
  const shake = t > 1.5 && t < 2.0 ? Math.sin(t * 90) * 14 * (2.0 - t) * 2 : 0;
  $('bill').style.opacity = t < 0.5 ? 0 : 1 - bo;
  $('bill').style.transform = `translateX(${shake}px) translateY(${(1 - easeOut(b)) * 200}px) rotate(${(1 - easeOut(b)) * -6 + shake / 20}deg)`;
  $('amt').textContent = Math.round(347 * easeOut(prog(t, 0.6, 1.5)));
  slam('t2', t, 2.0, 3.3);

  // ٢: الأسباب 3.5–8
  slam('t3', t, 3.5, 7.8);
  pop('c1', t, 5.0, 7.8, 'rotate(-2deg)');
  pop('c2', t, 6.0, 7.8, 'rotate(1.5deg)');
  pop('c3', t, 7.0, 7.8, 'rotate(-1deg)');

  // ٣: الحل 8–11
  slam('t4', t, 8.0, 10.9);
  slam('t5', t, 8.8, 10.9);
  slam('t6', t, 9.6, 10.9);
  pop('t7', t, 10.2, 10.9, 'rotate(-3deg)');

  // ٤: الدعوة 11–15
  const w = easeOut(prog(t, 11.0, 11.4));
  $('wipe').style.height = (w * 1920) + 'px';
  slam('cta', t, 11.4, 99);
  pop('cta2', t, 11.9, 99);
  pop('qrbox', t, 12.3, 99);
  const u = prog(t, 12.7, 13.0);
  const pulse = t > 13 ? 1 + 0.04 * Math.sin((t - 13) * 2 * Math.PI) : 1;
  $('url').style.opacity = u;
  $('url').style.transform = `translateX(-50%) scale(${(0.6 + 0.4 * back(u)) * pulse})`;
};
window.render(0);
</script>
</body>
</html>
